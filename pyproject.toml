[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-financial-intelligence-ocr-platform"
version = "0.1.0"
description = "OCR-driven financial intelligence platform for annual-report processing."
readme = "INSTALL.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "camelot-py>=1.0.9,<2",
    "fastapi>=0.111,<1",
    "numpy>=1.26.4,<2",
    "openai>=1.35,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2.2,<3",
    "pdfplumber>=0.11,<1",
    "pillow>=10.4,<12",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pymupdf>=1.24,<2",
    "sentence-transformers>=3,<6",
    "torch>=2.4,<3",
    "transformers>=4.41,<5",
    "uvicorn>=0.30,<1",
]

[project.scripts]
ocr-pipeline = "run_pipeline:main"

[project.optional-dependencies]
dev = [
    "black>=24.4,<26",
    "isort>=5.13,<7",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]
test = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
]

[tool.setuptools]
package-dir = {"" = "backend"}
py-modules = ["run_pipeline"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["api*", "ocr_engine*", "shared*", "workbook_population*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
py_version = 312

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests/integration",
    "backend/ocr_engine/tests",
    "backend/shared/tests",
    "backend/shared/normalization/tests",
    "backend/workbook_population/tests",
]
addopts = "-q"
markers = [
    "integration: tests that require real OCR dependencies and PDF fixtures",
]
